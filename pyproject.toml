[project]
name = "forecast-lab"
version = "0.1.0"
description = "Quantitative research on short-horizon market direction: a symbol-agnostic pipeline that measures what an experiment can resolve before it claims an edge."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alejandro Segura" }]
license = "MIT"
dependencies = [
    "pydantic>=2.7",  # validation at the boundary only (ADR-001 sec. 3)
    "typer>=0.12",    # the CLI is the composition root
    "rich>=13.7",     # console rendering
    "pandas>=2.2",    # bars and the feature matrix travel as DataFrames (ADR-001 sec. 3)
    "dukascopy-python>=4.0",  # the public CDN behind `fetch` (ADR-002 sec. 1)
    # Pinned exactly, and the only dependency that is. `ta` changes indicator values
    # between releases, so an upgrade would silently move every published number
    # without touching a line of our code. `uv.lock` already pins for anyone running
    # `uv sync`, but a routine `uv lock --upgrade` would walk straight past it; the
    # exact pin makes that a decision someone has to take on purpose.
    "ta==0.11.0",
    "statsmodels>=0.14",  # ADF and KPSS, reported as diagnostics (ADR-006 sec. 3)
    "scikit-learn>=1.5",  # the pipeline, the scaler, PCA, and three of the estimators
    # Pinned to versions that predate this machine's toolchain, for a reason that is not
    # about the libraries at all. Both load a native DLL through `ctypes`, and Windows
    # Smart App Control refuses any binary lacking a known publisher's signature or an
    # established reputation - which a freshly published wheel does not have. Measured
    # here: 4.7.0 and 3.4.1 are refused outright across repeated attempts, while 4.6.0
    # and 3.0.5 load first try. Upgrading is safe once a release has been in circulation
    # a while; upgrading blindly can make the two most interesting models vanish from
    # the comparison on any clean Windows 11 install (RUNBOOK sec. 7).
    "lightgbm==4.6.0",
    "xgboost==3.0.5",
    "matplotlib>=3.8",
]

# The composition root: the only place allowed to import concrete adapters and to
# touch the filesystem or the network (ADR-001 sec. 1).
[project.scripts]
forecast-lab = "forecast_lab.interfaces.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",  # pandas ships no type information of its own
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

# Never adopt the machine's own Python (there is a Microsoft Store 3.13 on PATH):
# the pin must mean the same thing on every box.
[tool.uv]
python-preference = "only-managed"
# Build mypy from source instead of taking its wheel. The published wheel ships
# mypyc-compiled .pyd extensions, and Windows Smart App Control blocks them outright -
# "DLL load failed: an application control policy blocked this file" - which silently
# removes one of the three gates on any machine with it enabled. The source build costs
# a few seconds at install time and makes type checking roughly three times slower,
# which on a project this size is invisible. A gate that does not run is worse.
no-binary-package = ["mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"  # aligned with .python-version / requires-python
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                            # assert is the point of a test
"src/forecast_lab/interfaces/cli.py" = ["B008"]  # typer.Option in defaults is the Typer idiom

[tool.mypy]
python_version = "3.12"  # aligned with .python-version / requires-python
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

# Third-party packages shipping no type information. Kept to the ones actually
# imported: an override for a package we do not depend on is dead configuration.
[[tool.mypy.overrides]]
module = [
    "dukascopy_python.*",
    "ta.*",
    "statsmodels.*",
    "sklearn.*",
    "lightgbm.*",
    "xgboost.*",
    "matplotlib.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gates stay hermetic: anything touching the network is opt-in.
addopts = ["-m", "not network"]
markers = [
    "unit: engine unit tests (fast, no external I/O)",
    "smoke: end-to-end pipeline over the synthetic fixture",
    "regression: tests that pin a previously fixed bug",
    "network: hits Dukascopy's public CDN; opt-in via `pytest -m network`",
]
